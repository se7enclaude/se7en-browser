# se7en Browser : serveur social (profils, amis, messages).
# Rien n'est déployé sans « npm run deploy » (compte Cloudflare de se7en).
name = "se7en-social"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Base de données : profils, amitiés, messages, photos de profil
[[d1_databases]]
binding = "DB"
database_name = "se7en-social"
database_id = "cd80c883-ae42-4cde-9cbb-bd67b228f576"
migrations_dir = "migrations"

# Le « direct » : une boîte par utilisateur, qui garde ses connexions ouvertes (messages instantanés, présence)
[[durable_objects.bindings]]
name = "BOITES"
class_name = "Boite"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Boite"]

# Ménage quotidien : vieux messages (90 jours) et signatures déjà vues
[triggers]
crons = ["17 3 * * *"]
